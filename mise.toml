[tools]
python = "3.14"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the game's Python dependencies"
# Some Python distributions create a venv without pip.  Bootstrap it before
# installing dependencies so `mise run run` works from a fresh environment.
run = "python -m ensurepip --upgrade && python -m pip install --upgrade pip pygame-ce"

[tasks.run]
description = "Launch Dungeon Escape"
depends = ["setup"]
run = "python -m backend.dungeon_improved"

[tasks.run-debug]
description = "Launch the game with the full map visible"
depends = ["setup"]
run = "python -m backend.dungeon_improved -d"

[tasks.check]
description = "Check all game modules for syntax errors"
run = "python -m py_compile backend/dungeon_improved.py backend/game.py backend/pathfinding.py backend/rendering.py backend/asset_manager.py backend/web_server.py"

[tasks.web-build]
description = "Build and start the illustrated Python-backed Docker edition"
run = "docker compose -f infrastructure/compose.yaml up --build"
